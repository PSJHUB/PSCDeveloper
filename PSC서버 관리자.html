<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSC서버 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{--navy:#2b0710;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:#7a0a1a;color:#fff;font-family:'Outfit','Pretendard',system-ui,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#2a0005 0%,#8c0b1c 30%,#e5243b 56%,#ff9a9a 80%,#fff1f0 100%)}
.bg::before{content:"";position:absolute;inset:-20% -10% auto -10%;height:90%;background:conic-gradient(from 180deg at 50% -10%,transparent 0 8%,rgba(255,255,255,.22) 10% 12%,transparent 14% 22%,rgba(255,255,255,.14) 24% 26%,transparent 28% 40%,rgba(255,255,255,.2) 42% 44%,transparent 46% 100%);filter:blur(14px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%);animation:sway 14s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.9))}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 18s ease-in-out infinite alternate}
.o1{width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:#ff4d2e}
.o2{width:40vmax;height:40vmax;right:-14vmax;top:22%;background:#ff1f6b;animation-duration:22s}
.o3{width:34vmax;height:34vmax;left:24%;bottom:-16vmax;background:#fff;opacity:.9;animation-duration:26s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.15)}}
@keyframes sway{to{transform:translateX(5%) rotate(2deg)}}
#snow{position:fixed;inset:0;z-index:1;pointer-events:none}
.meteor{position:fixed;z-index:2;display:block;height:2px;width:150px;border-radius:2px;opacity:0;pointer-events:none;background:linear-gradient(90deg,#fff7b0,#fff 18%,rgba(255,255,255,0));filter:drop-shadow(0 0 6px #fff7b0);animation:meteor 1.2s ease-in forwards}
@keyframes meteor{0%{opacity:0;transform:translate(0,0) rotate(-31deg)}12%{opacity:1}100%{opacity:0;transform:translate(-380px,228px) rotate(-31deg)}}

/* 장면 */
.scene{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:70px 24px 110px;text-align:center;opacity:0;filter:blur(14px);transform:scale(1.1);pointer-events:none;transition:opacity .8s,filter .8s,transform .8s}
.scene.on{opacity:1;filter:none;transform:none;pointer-events:auto;transition-duration:1s}
.scene.on>*{animation:rise 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.18s + .25s)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.18)}}
h1,h2{margin:0;font-family:'Do Hyeon','Outfit',sans-serif;font-weight:400;color:#fff;line-height:1.05;letter-spacing:.04em;text-shadow:0 0 8px #fff,0 0 24px #ffc2b8,0 0 50px #ff3b3b,0 0 100px #ff4d2e,0 0 160px #ff7a1a}
h1{font-size:clamp(60px,17vw,120px)}
h2{font-size:clamp(46px,13vw,88px)}
.role{font-weight:600;font-size:15px;letter-spacing:.34em;text-indent:.34em;text-shadow:0 0 12px #fff,0 0 26px #ff3b3b}
.bio{margin:0;max-width:22em;font-family:'Do Hyeon','Pretendard',sans-serif;font-size:clamp(20px,5vw,26px);line-height:1.5;letter-spacing:.05em;text-shadow:0 0 10px rgba(255,255,255,.9),0 0 24px #ff3b3b}
.avatar{width:170px;height:170px;border-radius:40px;background:#fff;display:grid;place-items:center;font:400 84px/1 'Do Hyeon',sans-serif;color:var(--c,#e5243b);overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 28px rgba(255,200,190,.95),0 0 80px var(--c,#ff3b3b),0 0 160px var(--c,#ff4d2e);animation:glow 2.4s ease-in-out infinite alternate!important}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.pic{border-radius:50%;background:transparent;width:190px;height:190px}
.tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;list-style:none;margin:0;padding:0}
.tags li{padding:7px 16px;border-radius:30px;background:rgba(255,255,255,.8);color:var(--navy);font-weight:600;font-size:14px;box-shadow:0 0 18px rgba(255,170,150,.95),0 0 44px rgba(255,50,70,.6)}
.crew{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;list-style:none;margin:0;padding:0}
.pf{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:0;color:#fff;cursor:pointer;font:400 17px/1 'Do Hyeon',sans-serif;letter-spacing:.04em;text-shadow:0 0 10px #fff,0 0 22px #ff3b3b;transition:transform .15s}
.pf img,.pf i{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:30px;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 18px #fff,0 0 40px var(--c),0 0 70px var(--c)}
.pf:hover,.pf:focus-visible{transform:translateY(-3px);outline:none}
.pf::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);transform:translate(-50%,-4px);padding:4px 9px;border-radius:6px;background:#fff;color:var(--navy);font:600 12px/1.3 'Outfit',sans-serif;letter-spacing:.04em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;box-shadow:0 0 12px rgba(255,170,150,.9);z-index:2}
.pf:hover::after,.pf:focus::after,.pf:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.links{display:flex;gap:14px;list-style:none;margin:0;padding:0}
.links a{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 0 16px rgba(255,80,60,.95),0 0 36px rgba(255,50,70,.7);transition:transform .15s}
.links a:hover,.links a:focus-visible{transform:translateY(-3px);outline:2px solid #fff;outline-offset:3px}
.links svg{width:22px;height:22px}
.links a{position:relative}
.links a::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,4px);padding:3px 8px;border-radius:6px;background:#fff;color:#0a1633;font:600 11px/1.3 'Outfit',sans-serif;letter-spacing:.08em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;box-shadow:0 0 12px rgba(255,170,150,.9)}
.links a:hover::after,.links a:focus::after,.links a:focus-visible::after{opacity:1;transform:translate(-50%,0)}
a.dcl{color:#fff;text-decoration:none;font-size:18px;letter-spacing:.1em;text-indent:0}
a.dcl:hover,a.dcl:focus-visible{outline:none;text-decoration:underline;text-underline-offset:6px}

/* 타임라인 */
#tl{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(32px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 150px));display:flex;gap:6px}
.seg{flex:1;height:18px;display:flex;align-items:center;cursor:pointer;border:0;background:none;padding:0}
.seg::before{content:"";display:block;width:100%;height:4px;border-radius:4px;background:rgba(43,7,16,.3)}
.seg i{position:absolute;display:block;height:4px;border-radius:4px;background:var(--navy);width:0}
.seg{position:relative}
.seg i{left:0;top:7px}
.ctl{position:fixed;z-index:6;bottom:calc(19px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer}
.ctl:focus-visible,.seg:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ctl svg{width:20px;height:20px}
#pp{left:18px}#music{right:18px}
.hint{position:fixed;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));right:20px;font-size:13px;letter-spacing:.12em;color:#fff;text-shadow:0 0 10px #ff3b3b}

/* 입장 */
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;cursor:pointer;border:0;width:100%;background:linear-gradient(180deg,#a30f22,#e5243b 60%,#ffd5d0);color:#fff;font:inherit}
#gate .box{display:flex;flex-direction:column;align-items:center;gap:18px}
#gate .tile{width:120px;height:120px;border-radius:28px;background:#fff;display:grid;place-items:center;font:400 40px/1 'Do Hyeon',sans-serif;color:#e5243b;transition:transform .8s cubic-bezier(.5,0,.9,.4)}
#gate p{margin:0;font-size:15px;letter-spacing:.08em}
#gate.hide{opacity:0;pointer-events:none;transition:opacity .8s ease-in}
#gate.hide .tile{transform:scale(7)}
#flash{position:fixed;inset:0;z-index:30;background:#fff;pointer-events:none;animation:flash .9s ease-out forwards}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bg::before,.orb,.avatar{animation:none!important}.scene,.scene.on{transition:none}.scene.on>*{animation:none}.meteor,#flash{display:none}}
</style>
</head>
<body>
<div class="bg"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<canvas id="snow" aria-hidden="true"></canvas>

<button id="gate" type="button" aria-label="입장하고 영상 시작"><span class="box"><span class="tile">PSC</span><p>클릭해서 입장</p></span></button>

<div id="stage"></div>
<div class="hint" id="hint"></div>
<button class="ctl" id="pp" type="button" aria-label="재생/일시정지"></button>
<div id="tl" role="tablist" aria-label="장면"></div>
<button class="ctl" id="music" type="button" aria-label="배경 음악 켜기/끄기"></button>

  dc:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.600 5.300A17 17 0 0 0 15.400 4l-.5 1a15 15 0 0 0-4 0L10.400 4a17 17 0 0 0-4.200 1.300C3.500 9.300 2.800 13.200 3.100 17a17 17 0 0 0 5.200 2.600l1.100-1.800c-.6-.2-1.200-.5-1.700-.8l.4-.3a12 12 0 0 0 10.400 0l.4.300c-.5.300-1.100.6-1.700.8l1.100 1.800a17 17 0 0 0 5.200-2.600c.4-4.400-.7-8.300-3.100-11.700zM9.300 14.700c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2zm5.400 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2z"/></svg>'
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* 장면 만들기 */
var scenes = [], durs = [];
scenes.push('<p class="role">개발자</p><h1>'+esc(SERVER)+'</h1><h2>관리자</h2><p class="bio">'+esc(TAGLINE)+'</p>'); durs.push(5000);
DEVS.forEach(function(d,k){
  var av = IMGS[k] ? '<img src="'+IMGS[k]+'" alt="">' : esc(d.name.charAt(0));
  scenes.push('<div class="avatar'+(IMGS[k]?' pic':'')+'" style="--c:'+d.c+'">'+av+'</div><p class="role">'+esc(d.role)+'</p><h2>'+esc(d.name)+'</h2><p class="bio">'+esc(d.bio)+'</p><ul class="tags">'+d.tags.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>');
  durs.push(6000);
});
scenes.push('<a class="role dcl" href="'+LINKS.discord+'" target="_blank" rel="noopener noreferrer">discord.gg/psc-script</a><h1>'+esc(SERVER)+'</h1><ul class="links"><li><a href="'+LINKS.discord+'" target="_blank" rel="noopener noreferrer" aria-label="디스코드" data-tip="DISCORD">'+ICON.dc+'</a></li><li><a href="'+LINKS.youtube+'" target="_blank" rel="noopener noreferrer" aria-label="유튜브" data-tip="YOUTUBE">'+ICON.yt+'</a></li></ul><ul class="crew">'+DEVS.map(function(d,k){return '<li><button type="button" class="pf" style="--c:'+d.c+'" data-tip="'+d.id+'" aria-label="'+esc(d.role+' '+d.name+' ID '+d.id)+'">'+(IMGS[k]?'<img src="'+IMGS[k]+'" alt="">':'<i>'+esc(d.name.charAt(0))+'</i>')+'<span>'+esc(d.name)+'</span></button></li>'}).join('')+'</ul>'); durs.push(7000);

var stage = $('#stage'), tl = $('#tl'), els = [], segs = [];
scenes.forEach(function(h,i){
  var s = document.createElement('section'); s.className = 'scene'; s.innerHTML = h;
  Array.prototype.forEach.call(s.children, function(c,j){c.style.setProperty('--i', j)});
  stage.appendChild(s); els.push(s);
  var b = document.createElement('button'); b.className = 'seg'; b.type = 'button'; b.setAttribute('aria-label', (i+1)+'번째 장면');
  b.innerHTML = '<i></i>'; b.onclick = function(){show(i)}; tl.appendChild(b); segs.push(b);
});

var cur = -1, prog = 0, playing = false, started = false;
function show(i){
  if (i < 0) i = 0; if (i >= els.length) i = 0;
  els.forEach(function(e,k){e.classList.toggle('on', k === i)});
  cur = i; prog = 0; meteor(); paint();
  $('#hint').textContent = (i+1) + ' / ' + els.length;
}
function paint(){
  segs.forEach(function(b,k){
    var f = k < cur ? 1 : k === cur ? (durs[k] ? Math.min(prog/durs[k],1) : 1) : 0;
    b.firstChild.style.width = (f*100) + '%';
  });
}
function setPlay(v){playing = v; $('#pp').innerHTML = v ? ICON.pause : ICON.play}
var last = 0;
(function loop(t){
  if (playing && started && durs[cur]) {
    prog += Math.min(t - last, 100);
    if (prog >= durs[cur]) show(cur + 1); else paint();
  }
  last = t; requestAnimationFrame(loop);
})(0);
$('#pp').onclick = function(e){e.stopPropagation(); if (!playing && cur === els.length-1) show(0); setPlay(!playing)};
document.addEventListener('keydown', function(e){
  if (!started) return;
  if (e.key === 'ArrowRight') show(cur+1);
  else if (e.key === 'ArrowLeft') show(cur-1);
  else if (e.key === ' ') {e.preventDefault(); $('#pp').click()}
});
document.addEventListener('click', function(e){
  if (!started || e.target.closest('a,button')) return;
  show(e.clientX < innerWidth*.3 ? cur-1 : cur+1);
});

/* 유성 */
function meteor(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var m = document.createElement('i'); m.className = 'meteor';
  m.style.left = (45 + Math.random()*50) + 'vw'; m.style.top = (4 + Math.random()*35) + 'vh';
  document.body.appendChild(m); setTimeout(function(){m.remove()}, 1300);
}

/* 눈 */
(function(){
  var c = $('#snow'), x = c.getContext('2d'), w = 0, h = 0, f = [];
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function size(){w = c.width = innerWidth; h = c.height = innerHeight}
  size(); addEventListener('resize', size);
  for (var i = 0, N = innerWidth < 600 ? 120 : 240; i < N; i++){var z = Math.random(); f.push({x:Math.random(), y:Math.random(), z:z, r:1+z*3.4, s:.5+z*1.8, d:Math.random()*6})}
  (function draw(){
    x.clearRect(0,0,w,h);
    f.forEach(function(p){
      p.y += p.s/h; p.d += .012; p.x += (Math.sin(p.d)*.5+.35)/w;
      if (p.y > 1.02){p.y = -.05; p.x = Math.random()} if (p.x > 1.02) p.x = -.02;
      x.shadowColor = '#ffd0c8'; x.shadowBlur = p.z > .55 ? 12 : 0; x.fillStyle = 'rgba(255,255,255,'+(.5+p.z*.5)+')';
      x.beginPath(); x.arc(p.x*w, p.y*h, p.r, 0, 6.283); x.fill();
    });
    requestAnimationFrame(draw);
  })();
})();

/* 배경 음악: 브라우저에서 직접 합성하는 오리지널 앰비언트 */
var ac = null, master = null, muted = false, st = 0, nt = 0;
var CH = [[53,57,60,64],[55,59,62,67],[52,55,59,62],[57,60,64,67]], PAT = [0,2,1,3,2,3,1,2];
function hz(m){return 440*Math.pow(2,(m-69)/12)}
function note(f,t,d,v,ty){
  var o = ac.createOscillator(), g = ac.createGain(); o.type = ty; o.frequency.value = f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);
}
function sched(){
  while (nt < ac.currentTime + .6){
    var c = CH[Math.floor(st/8)%4], k = st%8;
    note(hz(c[PAT[k]]+12), nt, .9, .07, 'triangle');
    if (k === 0){c.forEach(function(m){note(hz(m), nt, 2.2, .05, 'sine')}); note(hz(c[0]-12), nt, 2.2, .1, 'sine')}
    nt += .25; st++;
  }
}
function startMusic(){
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    master.gain.linearRampToValueAtTime(.55, ac.currentTime + 2.5);
    nt = ac.currentTime + .1; setInterval(sched, 150);
  }catch(e){ac = null}
}
$('#music').innerHTML = ICON.on;
$('#music').onclick = function(e){
  e.stopPropagation(); if (!ac) return;
  muted = !muted; master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.linearRampToValueAtTime(muted ? 0 : .55, ac.currentTime + .4);
  this.innerHTML = muted ? ICON.off : ICON.on;
};

/* 입장 */
$('#gate').onclick = function(){
  var g = this, f = document.createElement('div'); f.id = 'flash'; document.body.appendChild(f);
  setTimeout(function(){f.remove()}, 1000); g.classList.add('hide');
  startMusic(); started = true; setPlay(true); setTimeout(function(){show(0)}, 450);
};
setPlay(false); $('#pp').innerHTML = ICON.play;
</script>
